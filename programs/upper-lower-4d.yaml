format: pero-program/1
name: Верх/низ, 4 дня
author: Петр
description: >
  Гипертрофия, средний уровень. Пн верх A, вт низ A, чт верх B, пт низ B.
  Двойная прогрессия, 10–16 подходов на мышцу в неделю.
level: intermediate
units: kg

schedule:
  type: weekly
  days: { mon: upper-a, tue: lower-a, thu: upper-b, fri: lower-b }

progression:
  type: double

# Первые недели работаем с большим запасом, чтобы выучить амплитуду
phases:
  - { week: 1, rir: 3, note: "Учим амплитуду, подбираем веса" }
  - { week: 2, rir: 2 }

deload:
  every_weeks: 7
  sets_factor: 0.5
  rir: 3

warmup:
  suggest: true
  scheme: [ { percent: 50, reps: 8 }, { percent: 70, reps: 4 }, { percent: 85, reps: 2 } ]

workouts:
  - id: upper-a
    name: Верх A
    exercises:
      - { exercise: bench-press, variant: barbell, sets: 4, reps: 5-8, rir: 1-2, rest: 3m, start_weight: 70, note: С касанием груди }
      - { exercise: pull-up, variant: overhand, sets: 3, reps: 6-10, rir: 1-2, rest: 2m30s, note: "Вес добавляй, когда во всех подходах 10+" }
      - { exercise: incline-press, variant: dumbbell-30, sets: 3, reps: 8-12, rir: 1-2, rest: 2m30s }
      - { exercise: chest-supported-row, variant: machine, sets: 3, reps: 8-12, rir: 1-2, rest: 2m, start_weight: 60 }
      - { exercise: lateral-raise, variant: dumbbell, sets: 4, reps: 10-15, rir: 0-1, rest: 90s, start_weight: 10 }
      - { exercise: reverse-pec-deck, sets: 2, reps: 12-15, rir: 0-1, rest: 60s, start_weight: 40 }
      - { exercise: incline-db-curl, sets: 3, reps: 8-12, rir: 0-1, rest: 90s, start_weight: 12 }
      - { exercise: overhead-triceps-extension, variant: cable, sets: 3, reps: 8-12, rir: 0-1, rest: 90s, start_weight: 36 }

  - id: lower-a
    name: Низ A
    exercises:
      - { exercise: hack-squat, sets: 4, reps: 6-10, rir: 1-2, rest: 3m, start_weight: 100, note: Глубже 90° }
      - { exercise: romanian-deadlift, variant: dumbbell, sets: 3, reps: 8-10, rir: 2-3, rest: 2m30s, start_weight: 16, note: Вес одной гантели }
      - { exercise: seated-leg-curl, sets: 3, reps: 8-12, rir: 0-1, rest: 2m, start_weight: 90 }
      - { exercise: leg-extension, sets: 3, reps: 10-15, rir: 0-1, rest: 90s, sides: each, start_weight: 60, note: По одной ноге }
      - { exercise: standing-calf-raise, sets: 4, reps: 10-15, rir: 0-1, rest: 90s, note: Пауза внизу 1–2 с }
      - { exercise: cable-crunch, sets: 3, reps: 10-15, rir: 0-1, rest: 90s }

  - id: upper-b
    name: Верх B
    exercises:
      - { exercise: overhead-press, variant: machine, sets: 3, reps: 6-10, rir: 1-2, rest: 2m30s, start_weight: 55 }
      - { exercise: lat-pulldown, variant: neutral, sets: 3, reps: 8-12, rir: 1-2, rest: 2m }
      - { exercise: chest-press-machine, sets: 3, reps: 8-12, rir: 1-2, rest: 2m30s }
      - { exercise: one-arm-db-row, sets: 3, reps: 8-12, rir: 1-2, rest: 2m }
      - { exercise: pec-deck, sets: 2, reps: 10-15, rir: 0-1, rest: 90s, start_weight: 70 }
      - { exercise: reverse-pec-deck, sets: 3, reps: 12-15, rir: 0-1, rest: 90s, start_weight: 40 }
      - { exercise: lateral-raise, variant: cable, sides: each, sets: 3, reps: 12-15, rir: 0-1, rest: 60s }
      - { exercise: hammer-curl, variant: dumbbell, group: A, sets: 2, reps: 10-12, rir: 0-1, rest: 90s }
      - { exercise: triceps-pushdown, variant: rope, group: A, sets: 2, reps: 10-12, rir: 0-1, rest: 90s }

  - id: lower-b
    name: Низ B
    exercises:
      - { exercise: leg-press, sets: 3, reps: 8-12, rir: 1-2, rest: 2m30s, note: Таз не отрывается }
      - { exercise: hip-thrust, variant: barbell, sets: 3, reps: 8-12, rir: 1-2, rest: 2m, start_weight: 70 }
      - { exercise: bulgarian-split-squat, variant: dumbbell, sets: 2, reps: 8-10, rir: 2-3, rest: 60s, start_weight: 10 }
      - { exercise: seated-leg-curl, sides: each, sets: 3, reps: 10-12, rir: 0-1, rest: 90s }
      - { exercise: hip-abduction, sets: 2, reps: 12-15, rir: 0-1, rest: 60s }
      - { exercise: hip-adduction, sets: 2, reps: 12-15, rir: 0-1, rest: 60s }
      - { exercise: seated-calf-raise, sets: 4, reps: 12-15, rir: 0-1, rest: 60s }
      - { exercise: hanging-leg-raise, variant: captains-chair, sets: 3, reps: 8-15, rir: 0-1, rest: 90s }
