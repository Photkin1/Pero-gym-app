plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.pero.resttimer'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.resttimer"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.13.1'
}
