# Собирает APK для Android и веб-версию, выкладывает всё на GitHub Pages:
#   https://photkin1.github.io/Pero-gym-app/        — страница со ссылкой на APK
#   https://photkin1.github.io/Pero-gym-app/app/    — веб-версия
#   https://photkin1.github.io/Pero-gym-app/pero.apk
name: Build APK and site

on:
  push:
    branches: [pero-v1, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate bundled data (library, programs, docs)
        run: node scripts/gen-data.mjs

      - name: Typecheck and tests
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test src/core/core.test.ts

      - name: Stamp build number
        # Номер сборки = номер запуска CI: им же Android сравнивает версии, и по нему приложение видит обновления
        run: |
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);
            j.expo.version='1.0.'+process.env.GITHUB_RUN_NUMBER;
            j.expo.extra={...(j.expo.extra||{}),build:Number(process.env.GITHUB_RUN_NUMBER)};
            fs.writeFileSync('app.json',JSON.stringify(j,null,2));"

      # Сначала веб: он собирается за пару минут и выкладывается сразу, со старым APK
      - name: Build web version
        run: npx expo export --platform web --output-dir dist

      - name: Assemble site (web only)
        run: scripts/assemble-site.sh

      - name: Deploy web
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        # Только arm64: все современные телефоны, и APK в 3 раза меньше
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Assemble site (with new APK)
        run: scripts/assemble-site.sh android/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pero-apk
          path: out/pero.apk

      - name: Deploy web and APK
        run: |
          cd out
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
